services:
  db:
    image: postgres:17-alpine
    container_name: postgres-octocord
    ports:
      - 5433:5432
    environment:
      - POSTGRES_USER=postgres-octocord
      - POSTGRES_PASSWORD=postgres-octocord
      - POSTGRES_DB=postgres-octocorddb
    volumes:
      - octocord-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: redis-octocord
    ports:
      - 6380:6379
    volumes:
      -   octocord-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

volumes:
  octocord-postgres-data:
      name: octocord-postgres-data
  octocord-redis-data:
      name: octocord-redis-data